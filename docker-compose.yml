services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: crawldb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler"]
      interval: 5s
      retries: 5

  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CRAWLER_POSTGRES_DSN: postgresql://crawler:crawler@postgres/crawldb
      CRAWLER_API_TOKEN: ${CRAWLER_API_TOKEN:?required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: >
      crawler migrate
        --postgres postgresql://crawler:crawler@postgres/crawldb
    depends_on:
      postgres:
        condition: service_healthy

  crawler:
    build: .
    environment:
      CRAWLER_ADMISSION_TARGET_PENDING: ${CRAWLER_ADMISSION_TARGET_PENDING:-500000}
    command: >
      crawler daemon
        ${CRAWL_SEED_URLS:-https://example.com}
        --cycle-pages ${CRAWL_CYCLE_PAGES:-500}
        --refresh-ttl ${CRAWL_RECRAWL_TTL:-86400}
        --concurrency ${CRAWL_CONCURRENCY:-5}
        --delay ${CRAWL_DELAY:-1.0}
        --postgres postgresql://crawler:crawler@postgres/crawldb
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  observer:
    build: .
    command: >
      crawler observe-watch
        --interval ${CRAWLER_OBSERVE_INTERVAL:-300}
        --output /observations/observations.jsonl
        --max-bytes ${CRAWLER_OBSERVE_MAX_BYTES:-10485760}
        --max-files ${CRAWLER_OBSERVE_MAX_FILES:-7}
        --max-failures ${CRAWLER_OBSERVE_MAX_FAILURES:-5}
    environment:
      CRAWLER_POSTGRES_DSN: postgresql://crawler:crawler@postgres/crawldb
    volumes:
      - observer_logs:/observations
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  observer_logs:
